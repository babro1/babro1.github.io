<!DOCTYPE html>
<html>
  <head>
    <title>bart simons generator</title>
    <style>
      #topleft {
        position: absolute;
        clip: rect(0px, 125px, 125px, 0px);
      }
      #topright {
        position: absolute;
        clip: rect(0px, 250px, 125px, 125px);
      }
      #btmleft {
        position: absolute;
        clip: rect(125px, 125px, 250px, 0px);
      }
      #btmright {
        position: absolute;
        clip: rect(125px, 250px, 250px, 125px);
      }
      .comic {
        position: relative;
        left: -125px;
        width: 250px;
        height: 250px;
      }
    </style>
    <script src="random.js"></script>
    <script src="season1/random.js"></script>
    <script src="season2/random.js"></script>
    <script>
      links.forEach((image) => {
        img = new Image();
        img.src = image;
      }); //preload
      function slopup() {
        document.getElementById("topleft").src = randlink()+".png";
        document.getElementById("topright").src = randlink()+".png";
        document.getElementById("btmleft").src = randlink()+".png";
        document.getElementById("btmright").src = randlink()+".png";
      }
      function slopup1() {
        document.getElementById("topleft").src = "season1/"+grandlink1()+".png";
        document.getElementById("topright").src = "season1/"+grandlink1()+".png";
        document.getElementById("btmleft").src = "season1/"+grandlink1()+".png";
        document.getElementById("btmright").src = "season1/"+grandlink1()+".png";
      }
      function slopup2() {
        document.getElementById("topleft").src = "season2/"+grandlink2()+".png";
        document.getElementById("topright").src = "season2/"+grandlink2()+".png";
        document.getElementById("btmleft").src = "season2/"+grandlink2()+".png";
        document.getElementById("btmright").src = "season2/"+grandlink2()+".png";
      }
    </script>
  </head>
  <body>
    <center>
      <h1>bart simons comic</h1>
      <h2>random comic generator</h2>
      <a href="./">main page</a>
      <hr>
      <button onclick="slopup();">generate new comic</button>
      <button onclick="slopup1();">generate new season 1 comic</button>
      <button onclick="slopup2();">generate new season 2 comic</button>
      <br>
      <div class="comic">
        <img id="topleft">
        <img id="topright">
        <img id="btmleft">
        <img id="btmright">
      </div>
      <br>
      <br>
      <small>it doesnt become just 1 image so you must screencap in order to share your combinations</small>
    </center>
  </body>
</html>
