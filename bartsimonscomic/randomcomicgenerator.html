<!DOCTYPE html>
<html>
  <head>
    <title>bart simons comic generator</title>
    <meta content="bart simons comic generator" property="og:title" />
    <meta content="random bart simons comic generator" property="og:description" />
    <meta content="https://babro1.github.io/bartsimonscomic/embed.png" property="og:image" />
    <meta name="twitter:card" content="summary_large_image">
    <meta content="#FFFF00" data-react-helmet="true" name="theme-color" />
    <style>
      #topleft {
        position: absolute;
        clip: rect(0px, 125px, 125px, 0px);
      }
      #topright {
        position: absolute;
        clip: rect(0px, 250px, 125px, 125px);
      }
      #btmleft {
        position: absolute;
        clip: rect(125px, 125px, 250px, 0px);
      }
      #btmright {
        position: absolute;
        clip: rect(125px, 250px, 250px, 125px);
      }
      .comic {
        position: relative;
        left: -125px;
        width: 250px;
        height: 250px;
      }
      .spacing {
        height: 20px;
      }
      .au {
          transform: scaleX(-1);
      }
    </style>
    <script src="random.js"></script>
    <script src="season1/random.js"></script>
    <script src="season2/random.js"></script>
    <script>
      let au = 0;
      function preloadslides() {
        links.forEach((image) => {
          img = new Image();
          img.src = image;
        });
      }
      function slopup() {
        au = document.getElementById("aulabel").value;
        document.getElementById("topleft").src = randlink()+".png";
        document.getElementById("topright").src = randlink()+".png";
        document.getElementById("btmleft").src = randlink()+".png";
        document.getElementById("btmright").src = randlink()+".png";
        if (au)
        {
          document.getElementById("topleft").classList = "au";
          document.getElementById("topright").classList = "au";
          document.getElementById("btmleft").classList = "au";
          document.getElementById("btmright").classList = "au";
          if (Math.random() > 0.5)
            document.getElementById("topleft").classList = "";
          if (Math.random() > 0.5)
            document.getElementById("topright").classList = "";
          if (Math.random() > 0.5)
            document.getElementById("btmleft").classList = "";
          if (Math.random() > 0.5)
            document.getElementById("btmright").classList = "";
        }
        else
        {
          document.getElementById("topleft").classList = "";
          document.getElementById("topright").classList = "";
          document.getElementById("btmleft").classList = "";
          document.getElementById("btmright").classList = "";
        }
      }
      function slopup1() {
        au = document.getElementById("aulabel").value;
        document.getElementById("topleft").src = "season1/"+grandlinks1()+".png";
        document.getElementById("topright").src = "season1/"+grandlinks1()+".png";
        document.getElementById("btmleft").src = "season1/"+grandlinks1()+".png";
        document.getElementById("btmright").src = "season1/"+grandlinks1()+".png";
        if (au)
        {
          document.getElementById("topleft").class = (Math.round(Math.random()) ? "au" : "");
          document.getElementById("topright").class = (Math.round(Math.random()) ? "au" : "");
          document.getElementById("btmleft").class = (Math.round(Math.random()) ? "au" : "");
          document.getElementById("btmright").class = (Math.round(Math.random()) ? "au" : "");
        }
      }
      function slopup2() {
        au = document.getElementById("aulabel").value;
        document.getElementById("topleft").src = "season2/"+grandlinks2()+".png";
        document.getElementById("topright").src = "season2/"+grandlinks2()+".png";
        document.getElementById("btmleft").src = "season2/"+grandlinks2()+".png";
        document.getElementById("btmright").src = "season2/"+grandlinks2()+".png";
        if (au)
        {
          document.getElementById("topleft").class = (Math.round(Math.random()) ? "au" : "");
          document.getElementById("topright").class = (Math.round(Math.random()) ? "au" : "");
          document.getElementById("btmleft").class = (Math.round(Math.random()) ? "au" : "");
          document.getElementById("btmright").class = (Math.round(Math.random()) ? "au" : "");
        }
      }
    </script>
  </head>
  <body onload="preloadslides();">
    <center>
      <h1>bart simons comic</h1>
      <h2>random comic generator</h2>
      <p><a href="./">main page</a> - <a href="./randomcomicgenerator.html">comic generator</a> - <a href="./season1">season 1</a> - <a href="./season2">season 2</a></p>
      <hr>
      <label><input type="checkbox" id="aulabel">alternate universes allowed</label>
      <button onclick="slopup();">generate new comic</button>
      <button onclick="slopup1();">generate new season 1 comic</button>
      <button onclick="slopup2();">generate new season 2 comic</button>
      <br>
      <div class="spacing"></div>
      <br>
      <div class="comic">
        <img id="topleft">
        <img id="topright">
        <img id="btmleft">
        <img id="btmright">
      </div>
      <br>
      <br>
      <small>it doesnt become just 1 image so you must screencap in order to share your combinations</small>
    </center>
  </body>
</html>
