<!DOCTYPE html>
<html>
  <head>
    <title>bart simons generator</title>
    <style>
      #topleft {
        position: absolute;
        clip: rect(0px, 125px, 125px, 0px);
      }
      #topright {
        position: absolute;
        clip: rect(0px, 250px, 125px, 125px);
      }
      #btmleft {
        position: absolute;
        clip: rect(125px, 125px, 250px, 0px);
      }
      #btmright {
        position: absolute;
        clip: rect(125px, 250px, 250px, 125px);
      }
      .comic {
        position: absolute;
        left: -125px;
        width: 250px;
        height: 250px;
      }
    </style>
    <script src="random.js"></script>
    <script>
      function slopup() {
        document.getElementById("topleft").src = randlink()+".png";
        document.getElementById("topright").src = randlink()+".png";
        document.getElementById("btmleft").src = randlink()+".png";
        document.getElementById("btmright").src = randlink()+".png";
      }
      function slopup1() {
        document.getElementById("topleft").src = grandlink1()+".png";
        document.getElementById("topright").src = grandlink1()+".png";
        document.getElementById("btmleft").src = grandlink1()+".png";
        document.getElementById("btmright").src = grandlink1()+".png";
      }
      function slopup2() {
        document.getElementById("topleft").src = grandlink2()+".png";
        document.getElementById("topright").src = grandlink2()+".png";
        document.getElementById("btmleft").src = grandlink2()+".png";
        document.getElementById("btmright").src = grandlink2()+".png";
      }
    </script>
  </head>
  <body>
    <center>
      <h1>bart simons comic</h1>
      <h2>random comic generator</h2>
      <a href="./">main page</a>
      <hr>
      <button onclick="slopup();">generate new comic</button>
      <button onclick="slopup1();">generate new season 1 comic</button>
      <button onclick="slopup2();">generate new season 2 comic</button>
      <div class="comic">
        <img id="topleft">
        <img id="topright">
        <img id="btmleft">
        <img id="btmright">
      </div>
    </center>
  </body>
</html>
