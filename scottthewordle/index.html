        <title>Scott The Wordle</title>
        <link rel="icon" type="image/x-icon" href="./favicon.svg">
        <script>
            //God I wanna play f*cking golf
            let guesses = 0;
            let guesstext = "Scott The Wordle\n";
            let win = false;
            const words = ["words", "scott", "terry", "jerry", "wendy", "stash", "snips", "essig", "erics", "bathe", "lotts", "wario", "ouyas", "smash", "trial", "mario", "sonic", "party", "bongo", "ebola", "fling", "geist", "pepto", "video", "leaks", "leaky", "title", "kohls"];
            let wordnum = Math.floor(Math.random() * words.length);
            let rightword = words[wordnum];
            function didthethingwiththeinput() {
                if (guesses < 6 && !win)
                {
                    if (words.includes(document.getElementById("guess").value.toLowerCase()))
                    {
                        if (guesses == 0 && document.getElementById("guess").value.toLowerCase() == rightword)
                        {
                            let goodwords = words.filter(value => value !== rightword);
                            wordnum = Math.floor(Math.random() * goodwords.length);
                            rightword=goodwords[wordnum];
                        }
                        let right = 0;
                        let col = "";
                        let counts = [];
                        let rights = [];
                        for (i in document.getElementById("guess").value.toLowerCase())
                        {
                            let tempbool = false;
                            if (rightword[i] == document.getElementById("guess").value.toLowerCase()[i])
                            {
                                tempbool = true;
                            }
                            rights.push(tempbool);
                        }
                        for (i in document.getElementById("guess").value.toLowerCase())
                        {
                            tempbool = false;
                            /*for (j in document.getElementById("guess").value.toLowerCase())
                            {
                                if (rightword[i] == document.getElementById("guess").value.toLowerCase()[i])
                                {
                                    tempcount += 1;
                                }
                            }*/
                            for (j in document.getElementById("guess").value.toLowerCase())
                            {
                                if (document.getElementById("guess").value.toLowerCase()[i] == document.getElementById("guess").value.toLowerCase()[j])
                                {
                                    if (rights[j])
                                    {
                                        tempbool = true;
                                    }
                                }
                            }
                            rights[i] = tempbool;
                        }
                        for (i in document.getElementById("guess").value.toLowerCase())
                        {
                            let tempcount = 0;
                            /*for (j in document.getElementById("guess").value.toLowerCase())
                            {
                                if (rightword[i] == document.getElementById("guess").value.toLowerCase()[i])
                                {
                                    tempcount += 1;
                                }
                            }*/
                            for (j in document.getElementById("guess").value.toLowerCase())
                            {
                                if (rightword[j] == document.getElementById("guess").value.toLowerCase()[i] && rightword[i] != document.getElementById("guess").value.toLowerCase()[i] && !rights[i])
                                {
                                    tempcount += 1;
                                }
                            }
                            counts.push(tempcount);
                        }
                        guesstext += document.getElementById("guess").value.toLowerCase();
                        guesstext += " (";
                        for (i in document.getElementById("guess").value.toLowerCase())
                        {
                            document.getElementById("guessed"+guesses.toString()+"r"+i.toString()+"p").innerHTML = document.getElementById("guess").value.toLowerCase()[i];
                            if (document.getElementById("guess").value.toLowerCase()[i] == rightword[i]) {
                                document.getElementById("guessed"+guesses.toString()+"r"+i.toString()).style = "background-color: rgb(64,240,64)"
                                right += 1;
                                guesstext += "🟩";
                                for (j in counts)
                                {
                                    if (document.getElementById("guess").value.toLowerCase()[j] == document.getElementById("guess").value.toLowerCase()[i])
                                    {
                                        counts[j] -= 1;
                                    }
                                }
                            }
                            else {
                                if (rightword.includes(document.getElementById("guess").value.toLowerCase()[i]) && counts[i]>0)
                                {
                                    guesstext += "🟨";
                                    document.getElementById("guessed"+guesses.toString()+"r"+i.toString()).style = "background-color: rgb(240,240,32)"
                                    for (j in counts)
                                    {
                                        if (document.getElementById("guess").value.toLowerCase()[j] == document.getElementById("guess").value.toLowerCase()[i])
                                        {
                                            counts[j] -= 1;
                                        }
                                    }
                                }
                                else
                                {
                                    guesstext += "⬛";
                                    document.getElementById("guessed"+guesses.toString()+"r"+i.toString()).style = "background-color: rgb(128,128,128)"
                                }
                            }
                        }
                        guesstext += ")\n";
                        if (guesses >= 5 && right != 5)
                        {
                            document.getElementById("youlost").hidden = false;
                            document.getElementById("youlosttext").innerHTML = "You lost.<br>Correct word: "+rightword;
                            document.getElementById("getclipboard").hidden = false;
                            document.getElementById("submitguess").remove();
                            document.getElementById("guess").remove();
                            guesstext += "Correct word: ";
                            guesstext += rightword;
                        }
                        if (right == 5)
                        {
                            win = true;
                            document.getElementById("youwon").hidden = false;
                            document.getElementById("getclipboard").hidden = false;
                            document.getElementById("submitguess").remove();
                            document.getElementById("guess").remove();
                        }
                        guesses += 1;
                    }
                    else
                    {
                        if (document.getElementById("guess").value.toLowerCase().length != 5)
                        {
                            notifybub("Guess must be 5 letters long")
                        }
                        else
                        {
                            notifybub("Guessed word is not in our dictionary")
                        }
                    }
                }
            }
            function copyclipboard() {
                navigator.clipboard.writeText(guesstext).then(() => {
                    }).catch(err => {
                    console.error('Failed to copy: ', err);
                    });
            }
            function notifybub(notiftext) {
                document.getElementById("notifpopupbubble").innerHTML = ("<div id='notify'><p id='notifyin'></p></div>");
                document.getElementById("notifyin").innerHTML = notiftext;
                setTimeout(function() {document.getElementById("notify").remove();}, 2000);
            }
        </script>
